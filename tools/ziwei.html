<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
:root{
  --bg:#FAF9F5;--surface:#FFFFFF;--ink:#20201C;--muted:#6D6B63;--line:#E6E3DA;
  --accent:#C2452D;--accent-ink:#FFFFFF;--accent-soft:#F5E8E3;--row-hover:#F2EFE8;
  --radius:8px;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --lu:#2E7D32;--quan:#1565C0;--ke:#E65100;--ji:#C62828;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141416;--surface:#1D1D20;--ink:#EDEBE4;--muted:#9A968C;--line:#2C2C31;
    --accent:#E4705A;--accent-ink:#1A1210;--accent-soft:#38221D;--row-hover:#232327;
    --lu:#66BB6A;--quan:#42A5F5;--ke:#FFA726;--ji:#EF5350;
  }
}
:root[data-theme="dark"]{
  --bg:#141416;--surface:#1D1D20;--ink:#EDEBE4;--muted:#9A968C;--line:#2C2C31;
  --accent:#E4705A;--accent-ink:#1A1210;--accent-soft:#38221D;--row-hover:#232327;
  --lu:#66BB6A;--quan:#42A5F5;--ke:#FFA726;--ji:#EF5350;
}
html{background:var(--bg);color:var(--ink)}
body{font-family:system-ui,-apple-system,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  line-height:1.75;-webkit-font-smoothing:antialiased;font-size:16px}
a{color:inherit}
.wrap{max-width:960px;margin:0 auto;padding:0 24px}
.topbar{border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:10}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;height:60px;gap:16px}
.brand{font-weight:700;font-size:15.5px;text-decoration:none;white-space:nowrap}
.btn,.input,select{height:36px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--surface);color:var(--ink);font:inherit;font-size:14.5px;padding:0 14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;
  transition:background .15s ease,border-color .15s ease}
.btn:hover{background:var(--row-hover);border-color:var(--muted)}
.btn:focus-visible,.input:focus-visible,select:focus-visible,a:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}
.btn-mini{height:32px;font-size:13px;padding:0 10px}
.btn-accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn-accent:hover{background:var(--accent);filter:brightness(1.06);border-color:var(--accent)}
.page-title{font-size:clamp(26px,4vw,34px);font-weight:800;margin:40px 0 6px}
.page-sub{color:var(--muted);font-size:15px;margin-bottom:28px}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{height:34px;padding:0 16px;border:1px solid var(--line);border-radius:20px;background:var(--surface);
  color:var(--ink);font-size:14px;cursor:pointer;transition:all .15s ease}
.tab:hover{border-color:var(--accent);color:var(--accent)}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.panel{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:24px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;color:var(--muted)}
.field .input,.field select{width:100%}
.row-inline{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.row-inline .field{flex:1;min-width:150px}
.footer{border-top:1px solid var(--line);padding:24px 24px 36px;color:var(--muted);font-size:13px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;height:36px}
/* 命盘 */
.chart-scroll{overflow-x:auto;margin-top:22px}
.chart{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));grid-template-rows:repeat(4,minmax(150px,auto));
  gap:6px;min-width:660px}
.cell{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px 9px;font-size:12px;line-height:1.5;min-width:0}
.cell.soul-palace{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cell.flow-hit{background:var(--accent-soft)}
.cell-head{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.cell-name{font-size:14px;font-weight:800}
.cell-branch{font-family:var(--mono);font-size:11px;color:var(--muted)}
.badge{display:inline-block;font-size:10px;line-height:1.5;padding:0 5px;border-radius:8px;border:1px solid var(--accent);color:var(--accent);margin-left:4px;vertical-align:1px}
.star-row{margin-top:5px;display:flex;flex-wrap:wrap;gap:4px}
.star{font-size:12px;white-space:nowrap}
.star.major{font-weight:700}
.star .dim{color:var(--muted);font-size:10px;font-weight:400}
.mut{display:inline-block;width:15px;height:15px;line-height:15px;text-align:center;border-radius:50%;
  color:#fff;font-size:10px;margin-left:2px;vertical-align:1px}
.mut-0{background:var(--lu)}.mut-1{background:var(--quan)}.mut-2{background:var(--ke)}.mut-3{background:var(--ji)}
.flow-pill{display:inline-block;font-size:10px;padding:0 5px;border-radius:8px;background:var(--row-hover);
  border:1px solid var(--line);color:var(--muted);margin:2px 3px 0 0}
.blurb{color:var(--muted);font-size:10.5px;margin-top:5px;line-height:1.5}
.decadal{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:3px}
.center{grid-area:2/2/4/4;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:8px;justify-content:center}
.center h2{font-size:16px;font-weight:800}
.center .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12.5px}
.center .k{color:var(--muted);white-space:nowrap}
.center .v{font-family:var(--mono);font-size:12.5px;word-break:break-all}
.legend{margin-top:10px;font-size:11.5px;color:var(--muted)}
@media (max-width:640px){.grid{grid-template-columns:1fr}}
</style>

      ast = iztro.astro.bySolar(p[0] + '-' + parseInt(p[1],10) + '-' + parseInt(p[2],10), timeIdx, g, false, 'zh-CN');
    } else {
      var y = document.getElementById('l-year').value, mo = document.getElementById('l-month').value, d = document.getElementById('l-day').value;
      if (!y || !mo || !d) { err = '请填写完整的农历日期'; throw new Error(err); }
      var leap = document.getElementById('l-leap').checked;
      ast = iztro.astro.byLunar(y + '-' + mo + '-' + d, timeIdx, g, leap, false, 'zh-CN');
    }
  } catch (e) {
    alert('排盘失败：' + (e && e.message ? e.message : e));
    return;
  }
  document.getElementById('result').hidden = false;
  renderChart();
  renderHoroscope();
  try {
    document.getElementById('ai-panel').hidden = !(localStorage.getItem('lgr_admin_v1') === '1');
  } catch (e) {}
}

function starChip(st, flowMut) {
  var html = '<span class="star major">' + st.name;
  if (st.brightness) html += ' <span class="dim">' + st.brightness + '</span>';
  if (st.mutagen) html += '<span class="mut ' + MUT_CLS[['禄','权','科','忌'].indexOf(st.mutagen)] + '">' + st.mutagen + '</span>';
  if (flowMut && flowMut[st.name] !== undefined) html += '<span class="mut ' + MUT_CLS[flowMut[st.name]] + '">流' + '禄权科忌'[flowMut[st.name]] + '</span>';
  return html + '</span>';
}

function renderChart() {
  var chart = document.getElementById('chart');
  chart.innerHTML = '';
  var h = ast.horoscope(document.getElementById('h-date').value || undefined);
  var flowMut = {};
  (h.yearly.mutagen || []).forEach(function(name, i){ flowMut[name] = i; });

  ast.palaces.forEach(function(p) {
    var pos = POS[p.earthlyBranch];
    if (!pos) return;
    var cell = document.createElement('div');
    cell.className = 'cell' + (p.name === '命宫' ? ' soul-palace' : '');
    cell.style.gridRow = pos[0];
    cell.style.gridColumn = pos[1];

    var html = '<div class="cell-head"><span class="cell-name">' + p.name +
      (p.isBodyPalace ? '<span class="badge">身</span>' : '') +
      '</span><span class="cell-branch">' + p.heavenlyStem + p.earthlyBranch + '</span></div>';

    var stars = '';
    p.majorStars.forEach(function(st){ stars += starChip(st, flowMut); });
    p.minorStars.forEach(function(st){ stars += '<span class="star">' + st.name + (st.brightness ? ' <span class="dim">' + st.brightness + '</span>' : '') + '</span>'; });
    p.adjectiveStars.forEach(function(st){ stars += '<span class="star dim">' + st.name + '</span>'; });
    if (stars) html += '<div class="star-row">' + stars + '</div>';

    if (p.decadal && p.decadal.range) {
      html += '<div class="decadal">大限 ' + p.decadal.range[0] + '-' + p.decadal.range[1] + ' 岁 · ' + p.decadal.heavenlyStem + p.decadal.earthlyBranch + '</div>';
    }
    if (BLURB[p.name]) html += '<div class="blurb">' + BLURB[p.name] + '</div>';

    cell.innerHTML = html;
    chart.appendChild(cell);
  });

  var c = document.createElement('div');
  c.className = 'center';
  c.innerHTML = '<h2>拉格朗日® 命盘</h2>' +
    '<div class="kv">' +
    '<span class="k">四柱</span><span class="v">' + ast.chineseDate + '</span>' +
    '<span class="k">阳历</span><span class="v">' + ast.solarDate + ' ' + ast.time + '</span>' +
    '<span class="k">农历</span><span class="v">' + ast.lunarDate + '</span>' +
    '<span class="k">生肖 · 星座</span><span class="v">' + ast.zodiac + ' · ' + ast.sign + '</span>' +
    '<span class="k">命主 · 身主</span><span class="v">' + ast.soul + ' · ' + ast.body + '</span>' +
    '<span class="k">五行局</span><span class="v">' + ast.fiveElementsClass + '</span>' +
    '</div>';
  chart.appendChild(c);
}

function renderHoroscope() {
  if (!ast) return;
  var h = ast.horoscope(document.getElementById('h-date').value || undefined);
  lastH = h;
  var flowMut = {};
  (h.yearly.mutagen || []).forEach(function(name, i){ flowMut[name] = i; });

  // 流耀徽章
  var map = {};
  (h.yearly.palaceNames || []).forEach(function(name, i){
    map[name] = (h.yearly.stars && h.yearly.stars[i]) ? h.yearly.stars[i] : [];
  });
  document.querySelectorAll('#chart .cell').forEach(function(cell){
    cell.querySelectorAll('.flow-pill').forEach(function(n){ n.remove(); });
    cell.classList.remove('flow-hit');
  });
  ast.palaces.forEach(function(p){
    var pills = (map[p.name] || []).map(function(s){ return '<span class="flow-pill">' + s.name + '</span>'; }).join('');
    if (!pills) return;
    var cell = findCell(p.earthlyBranch);
    if (cell) {
      cell.insertAdjacentHTML('beforeend', '<div>' + pills + '</div>');
      if (p.name === '命宫') cell.classList.add('flow-hit');
    }
  });

  // 中宫加运限行
  var center = document.querySelector('.center');
  var old = center.querySelector('.flow-kv'); if (old) old.remove();
  var d = h.decadal, y = h.yearly;
  var kv = document.createElement('div');
  kv.className = 'kv flow-kv';
  kv.innerHTML = '<span class="k">流年</span><span class="v">' + y.heavenlyStem + y.earthlyBranch + '年 · 流年命宫在' + y.earthlyBranch + '</span>' +
    '<span class="k">流年四化</span><span class="v">禄' + y.mutagen[0] + ' 权' + y.mutagen[1] + ' 科' + y.mutagen[2] + ' 忌' + y.mutagen[3] + '</span>' +
    '<span class="k">大限</span><span class="v">' + d.heavenlyStem + d.earthlyBranch + ' · 大限命宫在' + d.earthlyBranch + '</span>';
  center.appendChild(kv);
}

function findCell(branch) {
  var found = null;
  document.querySelectorAll('#chart .cell').forEach(function(cell){
    var b = cell.querySelector('.cell-branch');
    if (b && b.textContent.slice(-1) === branch) found = cell;
  });
  return found;
}

function buildPayload(){
  var h = lastH || ast.horoscope(document.getElementById('h-date').value || undefined);
  var flowStars = {};
  (h.yearly.palaceNames || []).forEach(function(name, i){
    flowStars[name] = ((h.yearly.stars && h.yearly.stars[i]) || []).map(function(s){ return s.name; });
  });
  return {
    info: {gender: ast.gender, solarDate: ast.solarDate, lunarDate: ast.lunarDate, time: ast.time,
      timeRange: ast.timeRange, chineseDate: ast.chineseDate, zodiac: ast.zodiac, sign: ast.sign,
      soul: ast.soul, body: ast.body, fiveElementsClass: ast.fiveElementsClass},
    palaces: ast.palaces.map(function(p){ return {
      name: p.name, heavenlyStem: p.heavenlyStem, earthlyBranch: p.earthlyBranch,
      isBodyPalace: !!p.isBodyPalace,
      major: p.majorStars.map(function(s){ return {name: s.name, brightness: s.brightness || '', mutagen: s.mutagen || ''}; }),
      minor: p.minorStars.map(function(s){ return {name: s.name, brightness: s.brightness || ''}; }),
      adj: p.adjectiveStars.map(function(s){ return {name: s.name}; }),
      decadal: (p.decadal && p.decadal.range) || null,
      decadalStem: (p.decadal && p.decadal.heavenlyStem) || '',
      decadalBranch: (p.decadal && p.decadal.earthlyBranch) || '' }; }),
    flow: {yearStem: h.yearly.heavenlyStem, yearBranch: h.yearly.earthlyBranch,
      yearMutagen: h.yearly.mutagen || [], decadalStem: h.decadal.heavenlyStem,
      decadalBranch: h.decadal.earthlyBranch, stars: flowStars}
  };
}
function ensureToken(){
  var t = null;
  try { t = localStorage.getItem('lgr_api_token'); } catch (e) {}
  if (t) return Promise.resolve(t);
  var pw = prompt('输入开发者密码以使用 AI 详批');
  if (!pw) return Promise.reject(new Error('已取消'));
  return fetch(API + '/api/login', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({password: pw})}).then(function(r){ return r.json(); }).then(function(d){
    if (!d.token) throw new Error(d.error || '登录失败');
    try { localStorage.setItem('lgr_api_token', d.token); } catch (e) {}
    return d.token;
  });
}
function runAI(){
  var out = document.getElementById('ai-out');
  var btn = document.getElementById('ai-go');
  btn.disabled = true;
  out.textContent = '正在推演命盘，约需 3~5 分钟，请勿关闭页面……';
  ensureToken().then(function(tok){
    return fetch(API + '/api/interpret', {method: 'POST',
      headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + tok},
      body: JSON.stringify({chart: buildPayload(), date: document.getElementById('h-date').value})});
  }).then(function(r){ return r.json().then(function(d){ return {s: r.status, d: d}; }); }).then(function(x){
    if (x.s === 401) { try { localStorage.removeItem('lgr_api_token'); } catch (e) {} throw new Error('登录已过期，请再点一次并重新输入开发者密码'); }
    if (!x.d || !x.d.text) throw new Error((x.d && x.d.error) || ('请求失败 ' + x.s));
    out.textContent = x.d.text;
  }).catch(function(e){ out.textContent = '生成失败：' + (e && e.message || e); })
    .then(function(){ btn.disabled = false; });
}
document.getElementById('ai-go').addEventListener('click', runAI);

function cycleTheme(){
  var el=document.documentElement;
  var cur=el.getAttribute('data-theme')||'auto';
  var next=cur==='auto'?'light':(cur==='light'?'dark':'auto');
  if(next==='auto'){el.removeAttribute('data-theme');}else{el.setAttribute('data-theme',next);}
  try{localStorage.setItem('site_theme_v1',next);}catch(e){}
  document.querySelectorAll('[data-theme-label]').forEach(function(n){
    n.textContent=next==='auto'?'主题:自动':(next==='light'?'主题:亮色':'主题:暗色');
  });
}
(function(){
  var t='auto';
  try{var s=localStorage.getItem('site_theme_v1');if(s==='light'||s==='dark'){t=s;}}catch(e){}
  var label=t==='auto'?'主题:自动':(t==='light'?'主题:亮色':'主题:暗色');
  document.querySelectorAll('[data-theme-label]').forEach(function(n){n.textContent=label;});
})();
</script>
