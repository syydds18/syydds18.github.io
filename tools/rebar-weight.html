<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>钢筋理论重量计算器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
:root{
  --bg:#FAF9F5;--surface:#FFFFFF;--ink:#20201C;--muted:#6D6B63;--line:#E6E3DA;
  --accent:#C2452D;--accent-ink:#FFFFFF;--accent-soft:#F5E8E3;--row-hover:#F2EFE8;
  --radius:8px;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141416;--surface:#1D1D20;--ink:#EDEBE4;--muted:#9A968C;--line:#2C2C31;
    --accent:#E4705A;--accent-ink:#1A1210;--accent-soft:#38221D;--row-hover:#232327;
  }
}
:root[data-theme="dark"]{
  --bg:#141416;--surface:#1D1D20;--ink:#EDEBE4;--muted:#9A968C;--line:#2C2C31;
  --accent:#E4705A;--accent-ink:#1A1210;--accent-soft:#38221D;--row-hover:#232327;
}
html{background:var(--bg);color:var(--ink)}
body{font-family:system-ui,-apple-system,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  line-height:1.75;-webkit-font-smoothing:antialiased;font-size:16px}
a{color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 24px}
.topbar{border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:10}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;height:60px;gap:16px}
.brand{font-weight:700;font-size:15.5px;text-decoration:none;white-space:nowrap}
.btn,.input,select{height:36px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--surface);color:var(--ink);font:inherit;font-size:14.5px;padding:0 14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;
  transition:background .15s ease,border-color .15s ease}
.btn:hover{background:var(--row-hover);border-color:var(--muted)}
.btn:focus-visible,.input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.07)}
.btn-mini{height:32px;font-size:13px;padding:0 10px}
.page-title{font-size:clamp(26px,4vw,34px);font-weight:800;margin:40px 0 6px}
.page-sub{color:var(--muted);font-size:15px;margin-bottom:28px}
.page-sub code{font-family:var(--mono);font-size:13.5px;background:var(--accent-soft);
  color:var(--accent);padding:2px 8px;border-radius:5px}
.panel{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:24px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.chip-btn{height:32px;padding:0 13px;border:1px solid var(--line);border-radius:20px;
  background:var(--surface);color:var(--ink);font-family:var(--mono);font-size:13px;cursor:pointer;
  transition:all .15s ease}
.chip-btn:hover{border-color:var(--accent);color:var(--accent)}
.chip-btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted)}
.field .input{width:100%}
.result{margin-top:22px;padding-top:20px;border-top:1px dashed var(--line);
  display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.res-item .k{font-size:12.5px;color:var(--muted);letter-spacing:.06em}
.res-item .v{font-family:var(--mono);font-size:24px;font-weight:700;line-height:1.35}
.res-item .v small{font-size:13px;color:var(--muted);font-weight:400;margin-left:4px}
table{width:100%;border-collapse:collapse;margin-top:14px;font-family:var(--mono);font-size:13.5px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:12.5px;letter-spacing:.05em}
tr:hover td{background:var(--row-hover)}
.note{color:var(--muted);font-size:13px;margin-top:18px}
.footer{border-top:1px solid var(--line);padding:24px 24px 36px;color:var(--muted);font-size:13px}
@media (max-width:640px){.grid,.result{grid-template-columns:1fr 1fr}}
</style>
<script>(function(){try{var t=localStorage.getItem('site_theme_v1');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>

<script id="pw-gate-js">
(function(){
  var K='lgr_access_v1',H='ce6e5f08bbc81867000373e222ea71ff022385436bee9cb427502c118574c1b2',HA='8cb3003ac7f84ee859a7d99d5efcb01426bfdaf2103f3d058ca4380576e23365';
  function reveal(){
    var s=document.getElementById('pw-hide-style');
    if(s&&s.parentNode){ s.disabled=true; if(s.parentNode) s.parentNode.removeChild(s); }
    if(document.body) document.body.style.visibility='visible';
  }
  function unlock(){ try{localStorage.setItem(K,'1')}catch(e){} location.reload(); }
  function unlockAdmin(){ try{localStorage.setItem('lgr_admin_v1','1')}catch(e){} unlock(); }
  function fail(){ var g=document.getElementById('pw-gate'); if(!g)return; g.classList.remove('shake'); void g.offsetWidth; g.classList.add('shake'); var e=document.getElementById('pw-err'); if(e)e.style.visibility='visible'; }
  function check(){
    var i=document.getElementById('pw-in'),v=i?i.value:'';
    if(window.crypto&&crypto.subtle&&crypto.subtle.digest&&window.TextEncoder){
      crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)).then(function(buf){
        var h=[].map.call(new Uint8Array(buf),function(b){return('0'+b.toString(16)).slice(-2)}).join('');
        if(h===H)unlock();
        else if(h===HA)unlockAdmin();
        else fail();
      },fail);
    }else{
      if(v===atob('MjEzMzUx'))unlock();
      else if(v===atob('MjEzMzUxMTAwNw=='))unlockAdmin();
      else fail();
    }
  }
  var passed=false; try{passed=localStorage.getItem(K)==='1'}catch(e){}
  if(passed){ reveal(); return; }
  window.addEventListener('load',function(){ setTimeout(function(){
    if(!document.body) return;
    var d=document.createElement('div'); d.id='pw-gate';    d.innerHTML='<div class="pw-card"><img class="pw-mark" src="/apple-icon.png" alt=""/><h1 class="pw-title">拉格朗日®</h1><p class="pw-sub">输入访问密码，进入工具箱</p><input id="pw-in" type="password" inputmode="numeric" autocomplete="off" placeholder="访问密码"/><button class="pw-btn" id="pw-btn" type="button">进入</button><p class="pw-terms"><a href="/terms.html" target="_blank" rel="noopener">《使用条款与免责声明》</a> · 禁止爬虫抓取与收录</p><p id="pw-err">密码不对，再试试</p></div>';
    document.body.appendChild(d);
    var b=document.getElementById('pw-btn'),i=document.getElementById('pw-in');
    b.addEventListener('click',check);
    i.addEventListener('keydown',function(e){ if(e.key==='Enter') check(); });
    setTimeout(function(){ i.focus(); },80);
  },80); });
})();
</script>

      if(localStorage.getItem('lgr_admin_v1')==='1' && !document.getElementById('lgr-admin-pill')){

<body>
<header class="topbar"><div class="wrap topbar-inner">
  <a class="brand" href="../index.html">← 返回主页</a>
  <button class="btn btn-mini" data-theme-label onclick="cycleTheme()">主题:自动</button>
</div></header>

<main class="wrap">
  <h1 class="page-title">钢筋理论重量计算器</h1>
  <p class="page-sub">理论重量 <code>W(kg/m) = π/4 × d² × 7850 ≈ d² × 0.006165</code>（d 为公称直径 mm）</p>

  <div class="panel">
    <div class="field"><label>直径 d（mm）</label>
      <input class="input" id="d" type="number" min="3" max="100" step="0.5" value="12">
      <div class="chips" id="dchips"></div>
    </div>
    <div class="grid" style="margin-top:16px">
      <div class="field"><label>长度（m/根）</label><input class="input" id="len" type="number" min="0" step="0.1" value="1"></div>
      <div class="field"><label>根数</label><input class="input" id="cnt" type="number" min="1" step="1" value="1"></div>
      <div class="field"><label>损耗系数</label><input class="input" id="loss" type="number" min="1" step="0.001" value="1"></div>
    </div>
    <div class="result">
      <div class="res-item"><div class="k">每米重量</div><div class="v" id="r1">—</div></div>
      <div class="res-item"><div class="k">总重量</div><div class="v" id="r2">—</div></div>
      <div class="res-item"><div class="k">总重量（吨）</div><div class="v" id="r3">—</div></div>
    </div>
    <p class="note">损耗系数默认 1（不计损耗）；结算按 1.02~1.03 估损耗时填入即可。</p>
  </div>

  <h2 style="font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:40px 0 6px">常用规格速查</h2>
  <table id="tbl"><thead><tr><th>直径 d(mm)</th><th>每米重量(kg/m)</th><th>每根 9m(kg)</th></tr></thead><tbody></tbody></table>
  <p class="note">按 GB/T 1499.2 理论重量（密度 7850 kg/m³）计算，四舍五入三位小数。</p>
</main>

<footer class="footer"><div class="wrap">© 2026 拉格朗日 · 本地运行，数据不上传</div></footer>

<script>
var DS=[6,6.5,8,10,12,14,16,18,20,22,25,28,30,32,36,40];
function kgm(d){return d*d*0.006165;}
function fmt(n,x){return Number(n).toLocaleString('zh-CN',{minimumFractionDigits:x===undefined?3:x,maximumFractionDigits:x===undefined?3:x});}
function calc(){
  var d=parseFloat(document.getElementById('d').value)||0;
  var len=parseFloat(document.getElementById('len').value)||0;
  var cnt=parseFloat(document.getElementById('cnt').value)||0;
  var loss=parseFloat(document.getElementById('loss').value)||1;
  if(!loss||loss<1){loss=1;}
  var w=kgm(d);
  var total=w*len*cnt*loss;
  document.getElementById('r1').innerHTML=fmt(w)+'<small>kg/m</small>';
  document.getElementById('r2').innerHTML=fmt(total,2)+'<small>kg</small>';
  document.getElementById('r3').innerHTML=fmt(total/1000,4)+'<small>t</small>';
  document.querySelectorAll('#dchips .chip-btn').forEach(function(b){
    b.classList.toggle('on',parseFloat(b.dataset.d)===d);
  });
}
function initChips(){
  var box=document.getElementById('dchips');
  DS.forEach(function(d){
    var b=document.createElement('button');
    b.type='button';b.className='chip-btn';b.dataset.d=d;b.textContent='Φ'+d;
    b.title='设为直径 '+d+'mm';
    b.addEventListener('click',function(){document.getElementById('d').value=d;calc();});
    box.appendChild(b);
  });
}
function initTable(){
  var tb=document.querySelector('#tbl tbody');
  DS.forEach(function(d){
    var tr=document.createElement('tr');
    tr.innerHTML='<td>Φ'+d+'</td><td>'+fmt(kgm(d))+'</td><td>'+fmt(kgm(d)*9,2)+'</td>';
    tb.appendChild(tr);
  });
}
['d','len','cnt','loss'].forEach(function(id){
  document.getElementById(id).addEventListener('input',calc);
});
initChips();initTable();calc();
function cycleTheme(){
  var el=document.documentElement;
  var cur=el.getAttribute('data-theme')||'auto';
  var next=cur==='auto'?'light':(cur==='light'?'dark':'auto');
  if(next==='auto'){el.removeAttribute('data-theme');}else{el.setAttribute('data-theme',next);}
  try{localStorage.setItem('site_theme_v1',next);}catch(e){}
  document.querySelectorAll('[data-theme-label]').forEach(function(n){
    n.textContent=next==='auto'?'主题:自动':(next==='light'?'主题:亮色':'主题:暗色');
  });
}
(function(){
  var t='auto';
  try{var s=localStorage.getItem('site_theme_v1');if(s==='light'||s==='dark'){t=s;}}catch(e){}
  var label=t==='auto'?'主题:自动':(t==='light'?'主题:亮色':'主题:暗色');
  document.querySelectorAll('[data-theme-label]').forEach(function(n){n.textContent=label;});
})();
</script>
</body>
</html>
