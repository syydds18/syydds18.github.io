<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JSON 工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
:root{
  --bg:#FAF9F5;--surface:#FFFFFF;--ink:#20201C;--muted:#6D6B63;--line:#E6E3DA;
  --accent:#C2452D;--accent-ink:#FFFFFF;--accent-soft:#F5E8E3;--row-hover:#F2EFE8;
  --danger:#B3341F;--ok:#3E7A4E;--radius:8px;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141416;--surface:#1D1D20;--ink:#EDEBE4;--muted:#9A968C;--line:#2C2C31;
    --accent:#E4705A;--accent-ink:#1A1210;--accent-soft:#38221D;--row-hover:#232327;
    --danger:#F08A72;--ok:#7FB98F;
  }
}
:root[data-theme="dark"]{
  --bg:#141416;--surface:#1D1D20;--ink:#EDEBE4;--muted:#9A968C;--line:#2C2C31;
  --accent:#E4705A;--accent-ink:#1A1210;--accent-soft:#38221D;--row-hover:#232327;
  --danger:#F08A72;--ok:#7FB98F;
}
html{background:var(--bg);color:var(--ink)}
body{font-family:system-ui,-apple-system,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  line-height:1.75;-webkit-font-smoothing:antialiased;font-size:16px}
a{color:inherit}
.wrap{max-width:960px;margin:0 auto;padding:0 24px}
.topbar{border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:10}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;height:60px;gap:16px}
.brand{font-weight:700;font-size:15.5px;text-decoration:none;white-space:nowrap}
.btn,.input,select{height:36px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--surface);color:var(--ink);font:inherit;font-size:14.5px;padding:0 14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;
  transition:background .15s ease,border-color .15s ease}
.btn:hover{background:var(--row-hover);border-color:var(--muted)}
.btn:focus-visible,.input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.07)}
.btn-mini{height:32px;font-size:13px;padding:0 10px}
.page-title{font-size:clamp(26px,4vw,34px);font-weight:800;margin:40px 0 6px}
.page-sub{color:var(--muted);font-size:15px;margin-bottom:22px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .sep{width:1px;height:22px;background:var(--line)}
textarea{width:100%;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);
  color:var(--ink);font-family:var(--mono);font-size:13.5px;line-height:1.65;padding:14px;resize:vertical}
#in{min-height:260px}
#out{min-height:260px}
.status{min-height:24px;font-family:var(--mono);font-size:13px;margin:10px 0 22px}
.status .err{color:var(--danger)}
.status .ok{color:var(--ok)}
.footer{border-top:1px solid var(--line);padding:24px 24px 36px;color:var(--muted);font-size:13px}
</style>
<script>(function(){try{var t=localStorage.getItem('site_theme_v1');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body>
<header class="topbar"><div class="wrap topbar-inner">
  <a class="brand" href="../index.html">← 返回主页</a>
  <button class="btn btn-mini" data-theme-label onclick="cycleTheme()">主题:自动</button>
</div></header>

<main class="wrap">
  <h1 class="page-title">JSON 工具</h1>
  <p class="page-sub">格式化 / 压缩 / 校验，错误位置精确到行列</p>

  <div class="toolbar">
    <button class="btn btn-primary" id="fmt">格式化</button>
    <button class="btn" id="min">压缩</button>
    <button class="btn" id="chk">校验</button>
    <span class="sep"></span>
    <select id="indent" title="缩进宽度">
      <option value="2">缩进 2</option>
      <option value="4">缩进 4</option>
      <option value="tab">Tab</option>
    </select>
    <button class="btn" id="copyOut" title="复制结果">📋 复制结果</button>
    <button class="btn" id="swapAB" title="把结果放回输入框">⇅ 回填</button>
    <button class="btn" id="clear" title="清空输入与结果">清空</button>
  </div>
  <textarea id="in" placeholder='粘贴 JSON，如 {"name":"拉格朗日","tools":5}' spellcheck="false"></textarea>
  <div class="status" id="status"></div>
  <textarea id="out" placeholder="结果显示在这里" readonly spellcheck="false"></textarea>
  <p style="color:var(--muted);font-size:13px;margin-top:14px">所有处理在本地完成，数据不上传。</p>
</main>

<footer class="footer"><div class="wrap">© 2026 拉格朗日 · 本地运行，数据不上传</div></footer>

<script>
function getIndent(){
  var v=document.getElementById('indent').value;
  return v==='tab'?'\t':parseInt(v,10);
}
function posOf(text,offset){
  var before=text.slice(0,offset);
  var line=before.split('\n').length;
  var col=offset-before.lastIndexOf('\n');
  return {line:line,col:col};
}
function doParse(){
  var text=document.getElementById('in').value;
  if(!text.trim()){return null;}
  try{
    return {ok:true,data:JSON.parse(text),raw:text};
  }catch(e){
    var m=/position (\d+)/.exec(e.message);
    var pos=m?posOf(text,parseInt(m[1],10)):null;
    var msg=e.message.replace(/\s*at position \d+.*$/,'');
    return {ok:false,msg:msg,pos:pos};
  }
}
function setStatus(html,cls){
  var s=document.getElementById('status');
  s.innerHTML='<span class="'+cls+'">'+html+'</span>';
}
function doFormat(){
  var r=doParse();
  if(!r){setStatus('请输入 JSON','err');return;}
  if(!r.ok){
    var loc=r.pos?('第 '+r.pos.line+' 行 第 '+r.pos.col+' 列'):'位置未知';
    setStatus('✗ 解析失败：'+r.msg+'（'+loc+'）','err');return;
  }
  document.getElementById('out').value=JSON.stringify(r.data,null,getIndent());
  setStatus('✓ 合法 JSON，已格式化','ok');
}
function doMinify(){
  var r=doParse();
  if(!r){setStatus('请输入 JSON','err');return;}
  if(!r.ok){
    var loc=r.pos?('第 '+r.pos.line+' 行 第 '+r.pos.col+' 列'):'位置未知';
    setStatus('✗ 解析失败：'+r.msg+'（'+loc+'）','err');return;
  }
  document.getElementById('out').value=JSON.stringify(r.data);
  var s=document.getElementById('out').value.length;
  setStatus('✓ 合法 JSON，已压缩（'+s+' 字符）','ok');
}
function doCheck(){
  var r=doParse();
  if(!r){setStatus('请输入 JSON','err');return;}
  if(!r.ok){
    var loc=r.pos?('第 '+r.pos.line+' 行 第 '+r.pos.col+' 列'):'位置未知';
    setStatus('✗ 解析失败：'+r.msg+'（'+loc+'）','err');return;
  }
  var type=Array.isArray(r.data)?('数组 '+r.data.length+' 项'):(typeof r.data==='object'&&r.data?('对象 '+Object.keys(r.data).length+' 键'):typeof r.data);
  setStatus('✓ 合法 JSON（'+type+'）','ok');
}
document.getElementById('fmt').addEventListener('click',doFormat);
document.getElementById('min').addEventListener('click',doMinify);
document.getElementById('chk').addEventListener('click',doCheck);
document.getElementById('indent').addEventListener('change',function(){
  if(document.getElementById('out').value){doFormat();}
});
document.getElementById('copyOut').addEventListener('click',function(){
  var v=document.getElementById('out').value;
  if(!v){setStatus('结果为空，先格式化','err');return;}
  navigator.clipboard.writeText(v).then(function(){setStatus('✓ 结果已复制','ok');},
    function(){document.getElementById('out').select();setStatus('复制失败，请手动全选复制','err');});
});
document.getElementById('swapAB').addEventListener('click',function(){
  var v=document.getElementById('out').value;
  if(!v){setStatus('结果为空','err');return;}
  document.getElementById('in').value=v;
  setStatus('✓ 已回填到输入框','ok');
});
document.getElementById('clear').addEventListener('click',function(){
  document.getElementById('in').value='';
  document.getElementById('out').value='';
  setStatus('');
});
function cycleTheme(){
  var el=document.documentElement;
  var cur=el.getAttribute('data-theme')||'auto';
  var next=cur==='auto'?'light':(cur==='light'?'dark':'auto');
  if(next==='auto'){el.removeAttribute('data-theme');}else{el.setAttribute('data-theme',next);}
  try{localStorage.setItem('site_theme_v1',next);}catch(e){}
  document.querySelectorAll('[data-theme-label]').forEach(function(n){
    n.textContent=next==='auto'?'主题:自动':(next==='light'?'主题:亮色':'主题:暗色');
  });
}
(function(){
  var t='auto';
  try{var s=localStorage.getItem('site_theme_v1');if(s==='light'||s==='dark'){t=s;}}catch(e){}
  var label=t==='auto'?'主题:自动':(t==='light'?'主题:亮色':'主题:暗色');
  document.querySelectorAll('[data-theme-label]').forEach(function(n){n.textContent=label;});
})();
</script>
</body>
</html>
