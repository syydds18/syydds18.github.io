<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>

<title>Markdown 编辑器 · 拉格朗日</title>
<link rel="stylesheet" href="/articles/article.css"/>
<style>
body{padding:0;overflow:hidden}
.top{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line);background:#fff}
.top .logo{width:30px;height:30px;object-fit:contain;filter:drop-shadow(3px 3px #ffe28ab8)}
.top h1{font-size:16px;margin:0;letter-spacing:.02em}
.top .sp{flex:1}
.btn{font-family:inherit;font-size:13px;padding:8px 16px;border:1px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink);cursor:pointer}
.btn:hover{background:#fafafa}
.btn.primary{background:var(--hl)}
.btn.primary:hover{background:#ffd75e}
.btn:disabled{opacity:.45;cursor:default}
.meta-row{display:flex;flex-wrap:wrap;gap:10px;padding:12px 22px;border-bottom:1px solid var(--line);background:#fdfdfd}
.meta-row input{font-family:inherit;font-size:13px;padding:7px 11px;border:1px solid var(--line);border-radius:9px;outline:none;background:#fff;color:var(--ink)}
.meta-row input:focus{border-color:var(--ink)}
.meta-row input.w-title{flex:2;min-width:200px}
.meta-row input.w-slug{flex:1;min-width:130px}
.meta-row input.w-date{width:130px}
.meta-row input.w-tags{flex:1;min-width:150px}
.meta-row input.w-sum{flex:2;min-width:220px}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;padding:9px 22px;border-bottom:1px solid var(--line);background:#fff}
.tb{font-size:12px;padding:5px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;color:var(--t2)}
.tb:hover{border-color:var(--ink);color:var(--ink)}
.dd{position:relative;user-select:none;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd-menu{display:none;position:absolute;top:calc(100% + 6px);left:0;min-width:340px;max-height:340px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 36px rgba(0,0,0,.13);z-index:80;padding:5px}
.dd.open .dd-menu{display:block}
.dd-item{padding:8px 11px;font-size:12px;border-radius:7px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--t2)}
.dd-item:hover{background:#f2f2f4;color:var(--ink)}
.dd-empty{padding:8px 11px;font-size:12px;color:#999}
.split{display:flex;height:calc(100vh - 208px)}
#editor{flex:1;border:none;outline:none;resize:none;padding:22px 26px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;line-height:1.85;color:var(--ink);background:#fff;border-right:1px solid var(--line)}
.preview{flex:1;overflow:auto;padding:10px 30px 40px;background:#fff}
.preview .art-body{font-size:14.5px}
.pub-bar{display:flex;align-items:center;gap:10px;padding:10px 22px;border-top:1px solid var(--line);background:#fdfdfd}
.pub-bar input[type=password]{flex:1;max-width:320px;font-family:inherit;font-size:12.5px;padding:7px 11px;border:1px solid var(--line);border-radius:9px;outline:none}
.pub-bar input[type=password]:focus{border-color:var(--ink)}
.status{font-size:12px;color:var(--t3);flex:1;min-width:120px}
.status b{color:var(--ink)}
.hint{font-size:11px;color:var(--t3);padding:0 22px 10px;background:#fdfdfd}
@media(max-width:860px){.split{flex-direction:column;height:auto}#editor{height:40vh;border-right:none;border-bottom:1px solid var(--line)}.preview{height:40vh}}
#admin-lock{position:fixed;inset:0;z-index:2147483647;background:#fff;background-image:linear-gradient(#00000006 1px,transparent 0),linear-gradient(90deg,#00000006 1px,transparent 0);background-size:32px 32px;display:flex;align-items:center;justify-content:center;font-family:"Helvetica Neue",-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans",Arial,sans-serif}
#admin-lock .lock-card{width:min(330px,86vw);box-sizing:border-box;background:#fff;border:1px solid var(--ink);border-radius:16px;padding:30px 26px 26px;text-align:center}
#admin-lock .pw-mark{width:64px;height:64px;object-fit:contain;filter:drop-shadow(5px 6px #ffe28ab8);display:block;margin:0 auto 12px}
#admin-lock h2{font-size:18px;margin:0 0 6px}
#admin-lock p.sub{font-size:13px;color:var(--t2);margin:0 0 16px}
#admin-lock input{width:100%;box-sizing:border-box;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:15px;outline:none;font-family:inherit}
#admin-lock input:focus{border-color:var(--ink)}
#admin-lock button{margin-top:11px;width:100%;padding:11px;border-radius:10px;border:1px solid var(--ink);background:var(--hl);color:var(--ink);font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
#admin-lock button:hover{background:#ffd75e}
#admin-lock .err{color:#c0392b;font-size:12.5px;margin:10px 0 0;visibility:hidden}
#admin-lock.shake .lock-card{animation:pw-shake .4s}
</style>









<style id="pw-hide-style">body{visibility:hidden}</style>
<style id="pw-gate-style">
#pw-gate{position:fixed;inset:0;z-index:2147483647;visibility:visible;background-color:#fff;background-image:linear-gradient(#00000006 1px,transparent 0),linear-gradient(90deg,#00000006 1px,transparent 0);background-size:32px 32px;display:flex;align-items:center;justify-content:center;font-family:"Helvetica Neue",-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans",Arial,sans-serif}

@keyframes pw-shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
</style>
<script id="pw-gate-js">
(function(){
  var K='lgr_access_v1',H='ce6e5f08bbc81867000373e222ea71ff022385436bee9cb427502c118574c1b2',HA='8cb3003ac7f84ee859a7d99d5efcb01426bfdaf2103f3d058ca4380576e23365';
  function reveal(){
    var s=document.getElementById('pw-hide-style');
    if(s&&s.parentNode){ s.disabled=true; if(s.parentNode) s.parentNode.removeChild(s); }
    if(document.body) document.body.style.visibility='visible';
  }
  function unlock(){ try{document.cookie=K+'=1;path=/;SameSite=Lax';localStorage.removeItem(K)}catch(e){} location.reload(); }
  function unlockAdmin(){ try{localStorage.setItem('lgr_admin_v1','1')}catch(e){} unlock(); }
  function fail(){ var g=document.getElementById('pw-gate'); if(!g)return; g.classList.remove('shake'); void g.offsetWidth; g.classList.add('shake'); var e=document.getElementById('pw-err'); if(e)e.style.visibility='visible'; }
  function check(){
    var i=document.getElementById('pw-in'),v=i?i.value:'';
    if(window.crypto&&crypto.subtle&&crypto.subtle.digest&&window.TextEncoder){
      crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)).then(function(buf){
        var h=[].map.call(new Uint8Array(buf),function(b){return('0'+b.toString(16)).slice(-2)}).join('');
        if(h===H)unlock();
        else if(h===HA)unlockAdmin();
        else fail();
      },fail);
    }else{
      if(v===atob('MjEzMzUx'))unlock();
      else if(v===atob('MjEzMzUxMTAwNw=='))unlockAdmin();
      else fail();
    }
  }
  var passed=false; try{passed=document.cookie.split('; ').indexOf(K+'=1')>=0}catch(e){}
  if(passed){ reveal(); return; }
  function bootGate(){ setTimeout(function(){
    if(!document.body) return;
    var d=document.createElement('div'); d.id='pw-gate';    d.innerHTML='<div class="pw-card"><img class="pw-mark" src="/apple-icon.png" alt=""/><h1 class="pw-title">拉格朗日®</h1><p class="pw-sub">输入访问密码，进入工具箱</p><input id="pw-in" type="password" inputmode="numeric" autocomplete="off" placeholder="访问密码"/><button class="pw-btn" id="pw-btn" type="button">进入</button><p class="pw-terms"><a href="/terms.html" target="_blank" rel="noopener">《使用条款与免责声明》</a> · 禁止爬虫抓取与收录</p><p id="pw-err">密码不对，再试试</p></div>';
    document.body.appendChild(d);
    var b=document.getElementById('pw-btn'),i=document.getElementById('pw-in');
    b.addEventListener('click',check);
    i.addEventListener('keydown',function(e){ if(e.key==='Enter') check(); });
    setTimeout(function(){ i.focus(); },80);
  },80); }
  if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded',bootGate); }else{ bootGate(); }
})();
</script>
<script id="site-extra-js">
(function(){
  function bootExtras(){ setTimeout(function(){
    try{
      if(localStorage.getItem('lgr_admin_v1')==='1' && !document.getElementById('lgr-admin-pill')){
        var p=document.createElement('a');
        p.id='lgr-admin-pill';
        p.href='/admin/editor.html';
        p.textContent='✎ 写文章';
        p.style.cssText='position:fixed;right:22px;bottom:22px;z-index:2147483000;background:#ffe28a;color:#1a1a1a;border:1px solid #1a1a1a;border-radius:999px;padding:10px 18px;font-size:13px;font-weight:700;text-decoration:none;font-family:"Helvetica Neue",-apple-system,"PingFang SC",sans-serif';
        document.body.appendChild(p);
      }
    }catch(e){}

      if(document.querySelector('a.acard[data-extra]'))return;
      var seed=document.querySelector('a.acard');

      if(!box0||!box0.parentNode)return;

      fetch('/articles/list.json').then(function(r){return r.json()}).then(function(list){
        (list||[]).slice(0,6).forEach(function(it){
          var box=box0.cloneNode(true);

          if(!a)return;
          a.setAttribute('data-extra','1');
          a.setAttribute('href','/articles/view.html?slug='+encodeURIComponent(it.slug||''));
          var img=a.querySelector('img');
          if(img){ if(it.cover)img.setAttribute('src',it.cover); img.setAttribute('alt',it.title||''); }
          var d=a.querySelector('.acard-date'); if(d)d.textContent=(it.date||'').replace(/-/g,'.');
          var t=a.querySelector('.acard-title'); if(t)t.textContent=it.title||'';
          var e=a.querySelector('.acard-excerpt'); if(e)e.textContent=it.summary||'';
          box.style.opacity='1'; box.style.transform='none';
          if(a.style){a.style.opacity='1'; a.style.transform='none';}
          container.appendChild(box);
        });
      }).catch(function(){});
    }catch(e){}
    try{
      if(!document.querySelector('a.social[data-tool-ziwei]')){
        var seed=document.querySelector('a.social[href="/tools/rebar-weight.html"]');
        if(seed&&seed.parentNode){
          var row=seed.cloneNode(true);
          row.setAttribute('data-tool-ziwei','1');
          row.setAttribute('href','/tools/ziwei.html');
          var n1=row.querySelector('.s-idx'); if(n1)n1.textContent='07';
          var n2=row.querySelector('.s-name'); if(n2)n2.textContent='紫微斗数排盘';
          var n3=row.querySelector('.s-val'); if(n3)n3.textContent='站内即用，在线排盘';
          seed.parentNode.appendChild(row);
        }
      }
    }catch(e){}
  },1000); }
  if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded',bootExtras); }else{ bootExtras(); }
})();
</script>

<body>
<div id="admin-lock" style="display:none">
<div class="lock-card">
<img class="pw-mark" src="/apple-icon.png" alt=""/>
<h2>管理模式</h2>
<p class="sub">输入开发者密码，解锁文章发布</p>
<input id="lock-pass" type="password" inputmode="numeric" autocomplete="off" placeholder="开发者密码"/>
<button id="lock-btn" type="button">解锁</button>

</div>
</div>
<div class="top">
<img class="logo" src="/apple-icon.png" alt=""/>
<h1>拉格朗日 · Markdown 编辑器</h1>
<div class="sp"></div>
<button class="btn" id="btn-copy">复制 Markdown</button>
<button class="btn" id="btn-dl">下载 .md</button>
<button class="btn primary" id="btn-pub">发布上线</button>
</div>

<div class="meta-row">
<input class="w-title" id="f-title" placeholder="文章标题"/>
<input class="w-slug" id="f-slug" placeholder="slug（英文短横线）"/>
<input class="w-date" id="f-date" placeholder="日期 2026-11-06"/>
<input class="w-tags" id="f-tags" placeholder="标签（逗号分隔）"/>

</div>

<div class="toolbar">
<button class="tb" data-w="h2">H2</button>
<button class="tb" data-w="h3">H3</button>
<button class="tb" data-w="bold">加粗</button>
<button class="tb" data-w="italic">斜体</button>

<button class="tb" data-w="quote">引用</button>

<div class="tb dd" id="f-load"><span id="f-load-label">载入已有文章…</span><div class="dd-menu" id="f-load-menu"></div></div>
<button class="tb" id="btn-load">载入</button>

<span class="status" id="draft-state">草稿自动保存于本机</span>
</div>

<div class="split">
<textarea id="editor" placeholder="在这里写 Markdown……&#10;&#10;## 小标题&#10;正文支持 **加粗**、列表、引用、代码块、表格。&#10;&#10;- 列表项&#10;- 列表项&#10;"></textarea>

</div>

<div class="pub-bar">
<span class="status" id="server-state">服务器：未连接</span>
<span class="status" id="pub-state">写好 → 点「发布上线」→ 约 1 分钟后网站生效</span>
</div>
<p class="hint">提示：「发布上线」通过站点服务器直接发布（文章入库并即刻更新网站，约 1 分钟生效）；不想点发布也可以「复制 Markdown」发给管理员代发。</p>

<script src="/articles/marked.min.js"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var DRAFT = 'lgr_editor_draft', PATK = 'lgr_gh_pat', AK = 'lgr_admin_v1';
  var H_ADMIN = '8cb3003ac7f84ee859a7d99d5efcb01426bfdaf2103f3d058ca4380576e23365';

  // —— 管理模式锁 ——
  function adminOn(){ return localStorage.getItem(AK) === '1'; }
  function lockFail(){
    var g = $('admin-lock'); g.classList.remove('shake'); void g.offsetWidth; g.classList.add('shake');
    $('lock-err').style.visibility = 'visible';
  }
  function lockCheck(){
    var v = $('lock-pass').value || '';
    var done = function(h){
      if(h === H_ADMIN){ localStorage.setItem(AK, '1'); $('admin-lock').style.display = 'none'; apiLogin(v); }
      else lockFail();
    };
    if(window.crypto && crypto.subtle && crypto.subtle.digest && window.TextEncoder){
      crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)).then(function(buf){
        done([].map.call(new Uint8Array(buf), function(b){ return ('0'+b.toString(16)).slice(-2); }).join(''));
      }, lockFail);
    }else{ done(v === atob('MjEzMzUxMTAwNw==') ? H_ADMIN : ''); }
  }
  if(!adminOn() || !localStorage.getItem('lgr_api_token')){ $('admin-lock').style.display = 'flex'; }
  $('lock-btn').addEventListener('click', lockCheck);
  $('lock-pass').addEventListener('keydown', function(e){ if(e.key === 'Enter') lockCheck(); });

  // —— 载入已有文章（自绘下拉，避免原生 select 弹层闪关） ——
  var loadList = [], ddSlug = '';
  function fillLoadList(){
    var menu = $('f-load-menu');
    menu.innerHTML = '';
    if(!loadList.length){
      menu.innerHTML = '<div class="dd-empty">列表为空</div>';
      return;
    }
    loadList.forEach(function(it){
      var d = document.createElement('div');
      d.className = 'dd-item';
      d.textContent = (it.date || '') + ' · ' + it.title;
      d.addEventListener('click', function(){
        ddSlug = it.slug;
        $('f-load-label').textContent = it.title;
        $('f-load').classList.remove('open');
        $('draft-state').innerHTML = '<b>已选</b> · ' + it.title;
      });
      menu.appendChild(d);
    });
    $('draft-state').innerHTML = '<b>文章列表已就绪</b> · 共 ' + loadList.length + ' 篇';
  }
  function fetchLoadList(n){
    fetch('/articles/list.json').then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }).then(function(list){
      loadList = list || [];
      fillLoadList();
    }).catch(function(){
      $('draft-state').innerHTML = '<b>文章列表加载失败</b>，点「载入」自动重试';
      if(n > 0){ setTimeout(function(){ fetchLoadList(n - 1); }, 1500); }
    });
  }
  fetchLoadList(3);
  $('f-load').addEventListener('click', function(e){
    if(e.target.closest('.dd-menu')) return;
    this.classList.toggle('open');
  });
  document.addEventListener('click', function(e){
    if(!e.target.closest('#f-load')){ $('f-load').classList.remove('open'); }
  });
  $('btn-load').addEventListener('click', function(){
    if(loadList.length === 0){ fetchLoadList(3); $('draft-state').innerHTML = '正在重新加载文章列表…'; return; }
    var slug = ddSlug;
    if(!slug){ $('f-load').classList.add('open'); $('draft-state').innerHTML = '<b>先选择要载入的文章</b>'; return; }
    fetch('/articles/data/' + slug + '.md').then(function(r){ return r.text(); }).then(function(md){
      var meta = {}, body = md;
      var m = md.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
      if(m){
        body = md.slice(m[0].length);
        m[1].split(/\r?\n/).forEach(function(line){
          var i = line.indexOf(':');
          if(i > 0){ meta[line.slice(0,i).trim()] = line.slice(i+1).trim(); }
        });
      }
      $('f-title').value = meta.title || ''; $('f-slug').value = meta.slug || slug;
      $('f-date').value = meta.date || ''; $('f-tags').value = meta.tags || '';
      $('f-sum').value = meta.summary || ''; $('editor').value = body.trim();
      render();
      $('draft-state').innerHTML = '<b>已载入</b> · ' + (meta.title || slug);
    });
  });

  function today(){ var d = new Date(); var p = function(n){ return (n<10?'0':'') + n; }; return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()); }
  function slugify(s){ return (s||'').trim().toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60) || ('post-' + Date.now()); }
  function normSlug(s){
    s = (s || '').toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/-+/g, '-').replace(/^-+|-+$/g, '');
    if(!s){ s = 'post-' + (new Date()).toISOString().slice(0,10).replace(/-/g,'') + '-' + Math.random().toString(36).slice(2,6); }
    return s.slice(0, 64);
  }
  function collect(){
    var slug = normSlug($('f-slug').value || $('f-title').value);
    if(document.activeElement !== $('f-slug')){ $('f-slug').value = slug; }
    return {
      title: $('f-title').value.trim() || '未命名',
      slug: slug,
      date: $('f-date').value.trim() || today(),
      tags: $('f-tags').value.trim(),
      summary: $('f-sum').value.trim(),
      body: $('editor').value
    };
  }
  function compose(d){
    return '---\n' + 'title: ' + d.title + '\n' + 'slug: ' + d.slug + '\n' + 'date: ' + d.date + '\n' +
      (d.tags ? 'tags: ' + d.tags + '\n' : '') + (d.summary ? 'summary: ' + d.summary + '\n' : '') + '---\n\n' + d.body + '\n';
  }
  function render(){
    try{ $('preview').innerHTML = marked.parse($('editor').value); }catch(e){}
    $('draft-state').innerHTML = '✓ 已存草稿 · ' + new Date().toLocaleTimeString();
    saveDraft();
  }
  function saveDraft(){ try{ localStorage.setItem(DRAFT, JSON.stringify(collect())); }catch(e){} }
  function loadDraft(){
    try{
      var d = JSON.parse(localStorage.getItem(DRAFT) || 'null');
      if(d){ $('f-title').value = d.title || ''; $('f-slug').value = d.slug || ''; $('f-date').value = d.date || ''; $('f-tags').value = d.tags || ''; $('f-sum').value = d.summary || ''; $('editor').value = d.body || ''; }
      else { $('f-date').value = today(); }
    }catch(e){ $('f-date').value = today(); }
  }

  // 工具栏：选区包裹
  var wraps = {
    h2: ['## ', ''], h3: ['### ', ''], bold: ['**', '**'], italic: ['*', '*'],
    ul: ['- ', ''], quote: ['> ', ''], code: ['```\n', '\n```'], link: ['[', '](https://)'],
    table: ['\n| 列一 | 列二 |\n|---|---|\n| 值 | 值 |\n', ''], hr: ['\n---\n', '']
  };
  document.querySelectorAll('.tb').forEach(function(b){
    b.addEventListener('click', function(){
      var ta = $('editor'), w = wraps[b.getAttribute('data-w')] || ['',''];
      var s = ta.selectionStart, e = ta.selectionEnd, sel = ta.value.slice(s, e);
      ta.value = ta.value.slice(0, s) + w[0] + sel + w[1] + ta.value.slice(e);
      ta.focus(); ta.selectionStart = s + w[0].length; ta.selectionEnd = s + w[0].length + sel.length;
      render();
    });
  });

  $('editor').addEventListener('input', render);
  ['f-title','f-slug','f-date','f-tags','f-sum'].forEach(function(id){ $(id).addEventListener('input', saveDraft); });
  $('f-title').addEventListener('blur', function(){ if(!$('f-slug').value.trim()) $('f-slug').value = slugify($('f-title').value); });

  $('btn-copy').addEventListener('click', function(){
    navigator.clipboard.writeText(compose(collect()));
    $('draft-state').innerHTML = '<b>已复制 Markdown</b> · 粘贴给管理员即可代发';
  });
  $('btn-dl').addEventListener('click', function(){
    var d = collect();
    var blob = new Blob([compose(d)], { type: 'text/markdown' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = d.slug + '.md'; a.click();
  });

  // 站点服务器直发（后端 API：登录 -> 发文入库 -> 服务器同步上站）
  var LGR_API = 'https://1302897331-05i96qmvj3.ap-guangzhou.tencentscf.com';
  var ATK = 'lgr_api_token';
  function apiLogin(pw){
    return fetch(LGR_API + '/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw }) }).then(function(r){ return r.json(); }).then(function(j){
      if(j && j.token){ localStorage.setItem(ATK, j.token); $('server-state').innerHTML = '服务器：<b>已连接</b>'; return true; }
      $('server-state').innerHTML = '服务器：登录失败'; return false;
    }).catch(function(){ $('server-state').innerHTML = '服务器：未连接（网络？）'; return false; });
  }
  if(localStorage.getItem(ATK)){ $('server-state').innerHTML = '服务器：<b>已连接</b>'; }
  else if(adminOn()){ $('server-state').innerHTML = '服务器：未登录（重输开发者密码即可连接）'; }

  $('btn-pub').addEventListener('click', function(){
    var token = localStorage.getItem(ATK) || '';
    if(!token){ $('pub-state').innerHTML = '<b>先连服务器</b>：重输一次开发者密码即可登录；或改用复制 Markdown 代发'; return; }
    var d = collect();
    $('btn-pub').disabled = true;
    $('pub-state').innerHTML = '发布中…';
    fetch(LGR_API + '/api/articles/' + encodeURIComponent(d.slug), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ title: d.title, date: d.date, tags: d.tags, summary: d.summary, body: d.body })
    }).then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error || ('HTTP ' + r.status)); return j; }); })
      .then(function(j){
        $('pub-state').innerHTML = '<b>✓ 已发布上线</b>' + (j.synced ? ' · 约 1 分钟后生效' : ' · 已入库，同步稍后重试') +
          ' → <a href="' + (j.url || ('/articles/view.html?slug=' + d.slug)) + '" target="_blank">查看线上文章</a>';
      }).catch(function(e){
        $('pub-state').innerHTML = '<b>发布失败</b>：' + e.message;
      }).then(function(){ $('btn-pub').disabled = false; });
  });

  loadDraft();
  render();
})();
</script>
</body>
</html>
